plugins { id 'com.android.application' }

android {
    namespace 'com.hophop.keys'
    compileSdk 34
    defaultConfig {
        applicationId 'com.hophop.keys'
        minSdk 26
        targetSdk 34
        versionCode = (project.findProperty('vCode') ?: '1') as Integer
        versionName = "1." + (project.findProperty('vCode') ?: '0')
    }
    signingConfigs {
        release {
            // Ключ из секрета KS_B64 (тот же, что у магазина), иначе временный.
            storeFile file('../ci.jks')
            storePassword 'hopstore'
            keyAlias 'hopstore'
            keyPassword 'hopstore'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
