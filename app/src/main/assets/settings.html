<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HopKeys</title>
<style>
/* Тёмная графитовая гамма, как у Hangar Vault; акцент берётся из выбранной темы клавиатуры. */
:root{--bg:#141218;--card:#211F26;--card2:#2B2930;--line:#49454F;--text:#E6E0E9;--dim:#CAC4D0;--acc:#D0BCFF;--on-acc:#381E72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.4 "Google Sans",Roboto,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
.wrap{padding:8px 16px 40px;max-width:640px;margin:0 auto}
header{padding:28px 8px 12px}
h1{margin:0;font-size:32px;font-weight:600;letter-spacing:-.4px}
.sub{color:var(--dim);margin-top:2px}
h2{font-size:14px;font-weight:600;color:var(--acc);margin:26px 8px 10px}
.card{background:var(--card);border-radius:28px;padding:16px}
.card+.card{margin-top:8px}
.btn{height:48px;border-radius:24px;background:var(--card2);font-weight:600;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .15s cubic-bezier(.23,1,.32,1)}
.btn.pri{background:var(--acc);color:var(--on-acc)}
.btn:active,.chip:active,.tile:active,.sw:active{transform:scale(.96)}
.btn+.btn{margin-top:8px}
.step{display:flex;gap:12px;align-items:center;padding:6px 0}
.num{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;flex:none}
.num.ok{background:var(--acc);color:var(--on-acc)}
.step .t{flex:1;min-width:0}
.step .btn{width:auto;height:40px;padding:0 16px}
textarea{width:100%;border:0;border-radius:20px;background:var(--card2);padding:14px 16px;min-height:56px;resize:none;outline:none}
textarea:focus{box-shadow:0 0 0 2px var(--acc)}
/* превью клавиатуры */
#pv{border-radius:24px;overflow:hidden;position:relative}
#pv .kb{position:relative;padding:4px 2px 6px}
#pv .bar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px}
#pv .row{display:flex;justify-content:center}
#pv .k{display:grid;place-items:center;position:relative}
#pv .k i{position:absolute;inset:var(--g);border-radius:var(--r);display:grid;place-items:center;font-style:normal}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:20px;overflow:hidden;background:var(--card2);padding:0 0 8px;text-align:center;font-size:12.5px;font-weight:600;outline:2px solid transparent;transition:outline-color .2s}
.tile.on{outline-color:var(--acc)}
.tile .m{height:58px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px;margin-bottom:6px}
.tile .m span{display:flex;gap:3px;justify-content:center}
.tile .m b{flex:1;height:12px;max-width:16px}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:42px;height:42px;border-radius:50%;outline:3px solid transparent;outline-offset:2px;transition:outline-color .2s}
.sw.on{outline-color:var(--text)}
.sw.cc{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden}
.sw.cc input{position:absolute;inset:0;opacity:0}
.seg{display:flex;background:var(--card2);border-radius:22px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:18px;font-weight:600;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.rng{padding:8px 4px}
.rng .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.rng .l b{font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.tg{display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;text-align:left}
.tg .t{flex:1}
.tg .s{font-size:12.5px;color:var(--dim)}
.tg .sw2{width:52px;height:32px;border-radius:16px;background:var(--card2);outline:2px solid var(--line);position:relative;flex:none;transition:background .2s,outline-color .2s}
.tg .sw2::after{content:"";position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:transform .25s cubic-bezier(.23,1,.32,1),width .2s,height .2s,background .2s}
.tg.on .sw2{background:var(--acc);outline-color:var(--acc)}
.tg.on .sw2::after{transform:translateX(18px);width:24px;height:24px;left:4px;top:4px;background:var(--on-acc)}
.note{color:var(--dim);font-size:13px;padding:6px 8px}
.clip{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:20px;padding:6px 6px 6px 16px}
.clip+.clip{margin-top:6px}
.clip .x{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-size:14px}
.clip button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.clip button.on{color:var(--acc)}
.clip svg,.ico{width:20px;height:20px}
select{width:100%;height:44px;border-radius:22px;border:0;background:var(--card2);padding:0 16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div class="wrap">
 <header><h1>HopKeys</h1><div class="sub">Своя клавиатура. Без интернета: всё набранное остаётся на телефоне.</div></header>

 <div class="card" id="setup"></div>

 <h2>Как выглядит</h2>
 <div id="pv"></div>

 <h2>Стиль</h2>
 <div class="tiles" id="styles"></div>

 <h2>Цвет акцента</h2>
 <div class="card"><div class="sws" id="accs"></div></div>

 <h2>Фон</h2>
 <div class="card" id="bgc"></div>

 <h2>Клавиши</h2>
 <div class="card" id="keys"></div>

 <h2>Набор</h2>
 <div class="card" id="typing"></div>

 <h2>Отклик</h2>
 <div class="card" id="fb"></div>

 <h2>Буфер обмена</h2>
 <div class="card" id="clipset"></div>
 <div id="clips" style="margin-top:8px"></div>

 <h2>Сброс</h2>
 <div class="card"><button class="btn" id="reset">Вернуть всё по умолчанию</button><div class="note" id="ver"></div></div>
</div>
<script>
var K=window.Kb||null,P={},PR=[],ST={},resetArm=0,clearArm=0;
function load(){try{P=JSON.parse(K?K.prefs():'{}')}catch(e){P={}}try{PR=JSON.parse(K?K.presets():'[]')}catch(e){PR=[]}try{ST=JSON.parse(K?K.state():'{}')}catch(e){ST={}}}
function g(k,d){return P[k]!=null?P[k]:d}
function set(k,v){P[k]=String(v);if(K)K.set(k,String(v));draw()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var ICO={pin:'<path d="M9 4h6M10 4l-.5 7L6 14h12l-3.5-3L14 4M12 14v6"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'};
function ico(n,f){return '<svg viewBox="0 0 24 24" fill="'+(f?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[n]+'</svg>'}

/* цвета #AARRGGBB -> css */
function css(h){h=h.replace('#','');var a=parseInt(h.slice(0,2),16)/255,r=parseInt(h.slice(2,4),16),gg=parseInt(h.slice(4,6),16),b=parseInt(h.slice(6,8),16);return 'rgba('+r+','+gg+','+b+','+a.toFixed(3)+')'}
function argb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),parseInt(h.slice(6,8),16)]}
function hx(a){return '#'+a.map(function(x){return('0'+Math.max(0,Math.min(255,Math.round(x))).toString(16)).slice(-2)}).join('').toUpperCase()}
function mulA(h,k){var a=argb(h);a[0]*=k;return hx(a)}
function preset(id){for(var i=0;i<PR.length;i++)if(PR[i].id==id)return PR[i];return PR[0]||{}}
/* то же, что Theme.load в Java */
function theme(){
 var id=g('style','glass'),s=JSON.parse(JSON.stringify(preset(id))),acc=g('accent','');
 if(acc){s.accent=acc;if(id=='tinted'){var a=argb(acc);s.key=hx([0x40,a[1],a[2],a[3]]);s.fn=hx([0x28,a[1],a[2],a[3]])}}
 var ka=+g('keyAlpha',1);s.key=mulA(s.key,ka);s.fn=mulA(s.fn,ka);
 s.radius=+g('radius',s.radius);s.gap=+g('gap',s.gap);s.height=+g('height',52);s.font=+g('font',1);
 s.bgMode=g('bgMode','theme');s.bold=g('bold','0')=='1';s.upper=g('upper','0')=='1';s.numRow=g('numRow','0')=='1';s.hints=g('hints','1')=='1';
 return s}

function keyStyle(t,fill,enter){
 var st='background:'+css(fill)+';';
 if(t.look=='ios')st+='box-shadow:0 1.2px 0 rgba(0,0,0,.35);';
 if(t.look=='glass')st+='background:linear-gradient(rgba(255,255,255,'+(t.rim/510).toFixed(2)+'),transparent 60%),'+css(fill)+';box-shadow:inset 0 0 0 1px rgba(255,255,255,'+(t.rim/255).toFixed(2)+');';
 if(t.look=='neon')st='background:transparent;box-shadow:0 0 0 1.4px '+css(t.accent)+',0 0 6px '+css(mulA(t.accent,.5))+';';
 if(t.look=='minimal')st=enter?'background:'+css(t.accent)+';border-radius:50%!important;':'background:transparent;';
 if(t.look=='flat'&&t.rim>0)st+='box-shadow:inset 0 0 0 1px '+css(mulA(t.text,t.rim/255))+';';
 return st}

function kbHTML(t,small){
 var ru=['й ц у к е н г ш щ з х','ф ы в а п р о л д ж э','⇧ я ч с м и т ь б ю ⌫','?123 ◍ , Русский . ↵'],rows=ru.slice();
 if(t.numRow&&!small)rows.unshift('1 2 3 4 5 6 7 8 9 0');
 var bg=t.bgMode=='image'?'#3a3f52':t.bgMode=='blur'?'rgba(40,40,60,.5)':css(t.bg);
 var o='<div class="kb" style="background:'+(t.bgMode=='image'?'linear-gradient(135deg,#7a5cff,#ff7a59)':t.bgMode=='blur'?'linear-gradient(135deg,#355,#535)':css(t.bg))+';color:'+css(t.text)+';--r:'+t.radius+'px;--g:'+(t.gap/2)+'px">';
 if(t.bgMode=='image')o+='<div style="position:absolute;inset:0;background:rgba(0,0,0,'+g('bgDim',.35)+')"></div>';
 if(!small)o+='<div class="bar" style="position:relative;opacity:.8"><span>Буфер  Вставить</span><span>RU</span><span>Скрыть  Настройки</span></div>';
 rows.forEach(function(r){
  var ks=r.split(' ');o+='<div class="row" style="position:relative">';
  ks.forEach(function(k){
   var fn=/^(⇧|⌫|\?123|◍|↵)$/.test(k),enter=k=='↵',sp=k=='Русский',w=sp?4.6:(k=='?123'||k=='↵')?1.5:1;
   var fill=enter?(t.look=='glass'?mulA(t.accent,.55):t.accent):fn?t.fn:t.key;
   var lab=t.upper&&!fn&&!sp?k.toUpperCase():k,col=enter&&t.look!='neon'?'#fff':css(t.text);
   if(enter&&t.look=='neon')col=css(t.accent);
   o+='<div class="k" style="flex:'+w+';height:'+(small?14:Math.round(t.height*.78))+'px"><i style="'+keyStyle(t,fill,enter)+'color:'+col+';font-size:'+(small?0:(sp?11:fn?13:19)*t.font)+'px;font-weight:'+(t.bold?700:400)+'">'+(small?'':esc(lab))+'</i></div>'});
  o+='</div>'});
 return o+'</div>'}

function tg(k,l,s,d){var on=g(k,d?'1':'0')=='1';return '<button class="tg'+(on?' on':'')+'" data-tg="'+k+'" data-def="'+(d?1:0)+'"><span class="t">'+l+(s?'<div class="s">'+s+'</div>':'')+'</span><span class="sw2"></span></button>'}
function rng(k,l,min,max,step,d,fmt){var v=+g(k,d);return '<div class="rng"><div class="l"><span>'+l+'</span><b id="v-'+k+'">'+fmt(v)+'</b></div><input type="range" id="r-'+k+'" data-k="'+k+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+v+'" data-fmt="'+fmt.name+'"></div>'}
function pct(v){return Math.round(v*100)+'%'}
function px(v){return v+' dp'}
function ms(v){return v+' мс'}
function x(v){return (+v).toFixed(2)+'×'}

function draw(){
 var t=theme();
 document.documentElement.style.setProperty('--acc',css(t.look=='minimal'||t.id=='graphite'?'#FFD0BCFF':t.accent));
 /* настройка */
 var s=document.getElementById('setup');
 if(ST.enabled&&ST.current)s.innerHTML='<div class="step"><span class="num ok">✓</span><span class="t"><b>Клавиатура включена</b><div class="note" style="padding:0">Попробуй прямо здесь</div></span></div><textarea id="try" rows="2" placeholder="Напиши что-нибудь"></textarea>';
 else s.innerHTML='<div class="step"><span class="num'+(ST.enabled?' ok':'')+'">1</span><span class="t">Включи HopKeys в списке клавиатур</span><button class="btn pri" id="b-ime">Включить</button></div><div class="step"><span class="num'+(ST.current?' ok':'')+'">2</span><span class="t">Выбери HopKeys основной</span><button class="btn pri" id="b-pick">Выбрать</button></div><div class="note">Android покажет предупреждение, что клавиатура может видеть набранный текст. Так пишется для любой клавиатуры. У HopKeys нет доступа в интернет, поэтому отправить что-то наружу она не может.</div>';
 document.getElementById('pv').innerHTML=kbHTML(t,false);
 /* стили */
 var cur=g('style','glass');
 document.getElementById('styles').innerHTML=PR.map(function(p){var tt=JSON.parse(JSON.stringify(p));tt.height=20;tt.font=1;tt.bgMode='theme';
  var m='<div class="m" style="background:'+css(p.bg)+'">';for(var r=0;r<3;r++){m+='<span>';for(var i=0;i<(r==2?4:6);i++)m+='<b style="border-radius:'+Math.min(p.radius/3,6)+'px;'+keyStyle(tt,r==2&&i==3?p.accent:p.key,r==2&&i==3)+'"></b>';m+='</span>'}m+='</div>';
  return '<button class="tile'+(cur==p.id?' on':'')+'" data-style="'+p.id+'">'+m+esc(p.n)+'</button>'}).join('');
 /* акцент */
 var accs=['','#FF8AB4FF','#FFD0BCFF','#FF00F0FF','#FF2EE6B6','#FFFFD23F','#FFFF8A3D','#FFFF5A7A','#FFFFFFFF'],ca=g('accent','');
 document.getElementById('accs').innerHTML=accs.map(function(a){return '<button class="sw'+(ca==a?' on':'')+'" data-acc="'+a+'" style="background:'+(a?css(a):'conic-gradient(#555,#999,#555)')+'" aria-label="'+(a?'Цвет':'Как в стиле')+'"></button>'}).join('')+'<label class="sw cc" aria-label="Свой цвет"><input type="color" id="acc-c"></label>';
 /* фон */
 var bm=g('bgMode','theme');
 var bh='<div class="seg"><button data-bg="theme" class="'+(bm=='theme'?'on':'')+'">Как в стиле</button><button data-bg="image" class="'+(bm=='image'?'on':'')+'">Своё фото</button><button data-bg="blur" class="'+(bm=='blur'?'on':'')+'">Размытие</button></div>';
 if(bm=='image')bh+='<button class="btn" id="b-bg" style="margin-top:12px">'+(ST.hasBg?'Сменить фото':'Выбрать фото')+'</button>'+rng('bgDim','Затемнение фото',0,.8,.05,.35,pct);
 if(bm=='blur')bh+=(ST.blur?'':'<div class="note">Твой телефон не даёт приложениям настоящее размытие (нужен Android 12+ и включённая функция). Будет полупрозрачный фон.</div>')+rng('blur','Сила размытия',5,80,1,40,px);
 document.getElementById('bgc').innerHTML=bh;
 /* клавиши */
 document.getElementById('keys').innerHTML=rng('keyAlpha','Прозрачность клавиш',0.1,1.5,0.05,1,pct)+rng('radius','Скругление',0,26,1,t.radius,px)+rng('gap','Отступы между клавишами',0,14,1,t.gap,px)+rng('height','Высота клавиш',38,72,1,52,px)+rng('font','Размер букв',0.7,1.4,0.05,1,x)
  +tg('bold','Жирные буквы','',false)+tg('upper','Заглавные подписи','Как на iPhone до 2016 года, буквы всегда большие',false)+tg('numRow','Ряд цифр сверху','',false)+tg('hints','Подсказки символов в углу','Что выйдет при долгом нажатии',true)+tg('preview','Увеличение при нажатии','',true);
 document.getElementById('typing').innerHTML=tg('autoCap','Заглавная в начале предложения','',true)+tg('dotSpace','Точка двойным пробелом','',true)+tg('swipe','Курсор свайпом по пробелу','Веди пальцем по пробелу влево и вправо',true)+rng('longMs','Задержка долгого нажатия',200,700,25,350,ms);
 document.getElementById('fb').innerHTML=rng('vib','Вибрация',0,1,0.05,.4,pct)+rng('sound','Звук нажатия',0,1,0.05,0,pct);
 /* буфер */
 var lim=g('clipMax','1000');
 document.getElementById('clipset').innerHTML=tg('clipOn','Сохранять историю','Хранится только на телефоне. Пароли не сохраняются.',true)+'<div class="rng"><div class="l"><span>Сколько записей хранить</span></div><select id="clipMax">'+[100,500,1000,5000,20000].map(function(n){return '<option value="'+n+'"'+(lim==n?' selected':'')+'>'+n+'</option>'}).join('')+'</select><div class="note">Закреплённые записи не считаются и не удаляются.</div></div><button class="btn" id="b-clr">'+(clearArm?'Точно? Нажми ещё раз':'Очистить незакреплённые')+'</button>';
 drawClips();
 document.getElementById('reset').textContent=resetArm?'Точно? Нажми ещё раз':'Вернуть всё по умолчанию';
 document.getElementById('ver').textContent='HopKeys '+(K?K.version():'')+' · Hop Hop Studio';
 if(K)K.bars('#141218',true);
}
function drawClips(){
 var a=[];try{a=JSON.parse(K?K.clips():'[]')}catch(e){}
 document.getElementById('clips').innerHTML=a.length?a.slice(0,300).map(function(c){return '<div class="clip"><span class="x">'+esc(c.text)+'</span><button class="'+(c.pin?'on':'')+'" data-pin="'+c.id+'" aria-label="Закрепить">'+ico('pin',c.pin)+'</button><button data-del="'+c.id+'" aria-label="Удалить">'+ico('trash')+'</button></div>'}).join('')+(a.length>300?'<div class="note">Показаны первые 300 из '+a.length+'</div>':''):'<div class="note">История пуста. Скопируй текст где угодно, пока HopKeys выбрана основной клавиатурой.</div>';
}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;var d=b.dataset;
 if(b.id=='b-ime'){K&&K.openIme();return}
 if(b.id=='b-pick'){K&&K.picker();return}
 if(b.id=='b-bg'){K&&K.pickBg();return}
 if(d.style){set('style',d.style);if(K)K.set('radius',null),K.set('gap',null);delete P.radius;delete P.gap;draw();return}
 if(d.acc!=null){set('accent',d.acc);return}
 if(d.bg){set('bgMode',d.bg);if(d.bg=='image'&&!ST.hasBg&&K)K.pickBg();return}
 if(d.tg){var on=g(d.tg,d.def=='1'?'1':'0')=='1';set(d.tg,on?'0':'1');return}
 if(d.pin){K&&K.clipPin(d.pin);drawClips();return}
 if(d.del){K&&K.clipDel(d.del);drawClips();return}
 if(b.id=='b-clr'){if(!clearArm){clearArm=1;draw();return}clearArm=0;K&&K.clipClear();draw();return}
 if(b.id=='reset'){if(!resetArm){resetArm=1;draw();return}resetArm=0;K&&K.reset();load();draw();return}
});
document.addEventListener('input',function(e){
 var r=e.target;
 if(r.type=='range'){var k=r.dataset.k;P[k]=r.value;K&&K.set(k,r.value);var f=window[r.dataset.fmt];document.getElementById('v-'+k).textContent=f?f(+r.value):r.value;document.getElementById('pv').innerHTML=kbHTML(theme(),false);return}
});
document.addEventListener('change',function(e){
 var r=e.target;
 if(r.id=='acc-c'){var h=r.value.replace('#','');set('accent','#FF'+h.toUpperCase());return}
 if(r.id=='clipMax'){set('clipMax',r.value);return}
});
function onState(){try{ST=JSON.parse(K?K.state():'{}')}catch(e){}draw()}
function onBg(ok){ST.hasBg=ok||ST.hasBg;load();draw()}
load();draw();
</script>
</body></html>
